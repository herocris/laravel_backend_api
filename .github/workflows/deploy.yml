name: Prepare release (no remote deployment)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  package:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, fileinfo, pdo_sqlite, pdo_mysql, intl, zip, bcmath
          coverage: none
          tools: composer:v2
      - name: Build production package from the checked revision
        run: bash .github/deployment/package.sh "$RUNNER_TEMP/release"
      - name: Verify production package with isolated SQLite and CLI health check
        run: bash .github/deployment/test-package.sh "$RUNNER_TEMP/release/backend.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7
